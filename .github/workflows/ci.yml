name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    name: Test & package (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test VM security (runtime-security)
        run: npm run test:vm

      - name: Test database security (PGlite)
        run: npm run test:db

      - name: Test channel isolation
        run: npm run test:channels

      - name: Test hidden Electron UI (platform-preview)
        run: npm run test:ui

      - name: Test OCR security
        run: npm run test:ocr

      - name: Package (electron-builder NSIS)
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: haituo-setup
          path: dist/*.exe
          if-no-files-found: error
