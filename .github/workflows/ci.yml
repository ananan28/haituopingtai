name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    name: Test & package (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore verified Signal native resources
        run: npm run prepare:signal

      - name: Test VM security (runtime-security)
        run: npm run test:vm

      - name: Test local workspace authority boundary
        run: npm run test:local

      - name: Test database security (PGlite)
        run: npm run test:db

      - name: Test channel isolation
        run: npm run test:channels

      - name: Test persistent message records
        run: npm run test:messages

      - name: Test WhatsApp translation cache and virtual list lifecycle
        run: npm run test:whatsapp

      - name: Test WhatsApp sandbox preload in real Chromium
        run: npm run test:whatsapp:electron

      - name: Test Signal profile lifecycle
        run: npm run test:signal

      - name: Test native Signal workers in Electron with OS encryption
        run: npm run test:signal:electron

      - name: Test real Signal views in host window
        run: npm run test:signal:view

      - name: Test hidden Electron UI (platform-preview)
        run: npm run test:ui

      - name: Test OCR security
        run: npm run test:ocr

      - name: Package (electron-builder NSIS)
        run: npm run dist

      - name: Verify packaged resources
        run: npm run test:package

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: haituo-setup
          path: dist/*.exe
          if-no-files-found: error
