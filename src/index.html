<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>海拓商业版</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 认证视图：未登录时显示 -->
  <div id="auth-view" class="view auth-view is-active">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-name" data-brand>海拓商业版</span>
        <span class="brand-sub">平台</span>
      </div>
      <div id="config-notice" class="config-notice" hidden>
        未配置 Supabase：请复制 .env.example 为 .env 并填写 SUPABASE_URL 和 SUPABASE_ANON_KEY
      </div>
      <h2 id="auth-title" class="auth-title">会员登录</h2>
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab is-active" type="button">登录</button>
        <button id="tab-register" class="auth-tab" type="button">注册</button>
      </div>
      <form id="auth-form" class="auth-form">
        <label>
          邮箱
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
        </label>
        <label>
          密码
          <input id="password" type="password" autocomplete="current-password" placeholder="至少 6 位" />
        </label>
        <div id="login-only" class="auth-row">
          <label class="auth-remember">
            <input id="remember" type="checkbox" checked />
            记住密码
          </label>
          <a id="forgot-password" class="auth-link" href="#">忘记密码</a>
        </div>
        <div id="auth-msg" class="auth-msg"></div>
        <button id="auth-submit" type="submit">登录</button>
        <div id="oauth-block">
          <div class="auth-divider"><span>或</span></div>
          <button id="google-login" class="auth-oauth" type="button">使用 Google 登录</button>
        </div>
        <div class="auth-terms">
          登录/注册即代表你同意 <a href="#">服务协议</a> 与 <a href="#">隐私政策</a>
        </div>
      </form>
    </div>
  </div>

  <!-- 主界面视图：登录后显示 -->
  <div id="app-view" class="view app">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-name" data-brand>海拓商业版</span>
        <span class="brand-sub">平台</span>
      </div>
      <nav id="topnav" class="topnav" aria-label="主导航"></nav>
      <div class="topbar-actions">
        <div class="user-chip">
          <span id="user-avatar" class="user-avatar">?</span>
          <span id="user-name" class="user-name"></span>
          <span id="role-badge" class="role-badge">用户</span>
        </div>
        <button id="logout" class="logout-btn" type="button">退出登录</button>
      </div>
    </header>
    <main id="content" class="content"></main>
  </div>

  <script src="services.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
