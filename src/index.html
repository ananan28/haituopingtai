<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>海拓商业版</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- 认证视图：未登录时显示 -->
  <div id="auth-view" class="view auth-view is-active">
    <div class="auth-card">
      <div class="auth-brand">
        <span class="brand-name" data-brand>海拓商业版</span>
        <span class="brand-sub">平台</span>
      </div>
      <div id="config-notice" class="config-notice" hidden>
        未配置 Supabase：请复制 .env.example 为 .env 并填写 SUPABASE_URL 和 SUPABASE_ANON_KEY
      </div>
      <h2 id="auth-title" class="auth-title">会员登录</h2>
      <div class="auth-tabs">
        <button id="tab-login" class="auth-tab is-active" type="button">登录</button>
        <button id="tab-register" class="auth-tab" type="button">注册</button>
      </div>
      <form id="auth-form" class="auth-form">
        <label>
          邮箱
          <input id="email" type="email" autocomplete="email" placeholder="you@example.com" />
        </label>
        <label>
          密码
          <input id="password" type="password" autocomplete="current-password" placeholder="至少 6 位" />
        </label>
        <div id="login-only" class="auth-row">
          <label class="auth-remember">
            <input id="remember" type="checkbox" checked />
            记住密码
          </label>
          <a id="forgot-password" class="auth-link" href="#">忘记密码</a>
        </div>
        <div id="auth-msg" class="auth-msg"></div>
        <button id="auth-submit" type="submit">登录</button>
        <div id="oauth-block">
          <div class="auth-divider"><span>或</span></div>
          <button id="google-login" class="auth-oauth" type="button">使用 Google 登录</button>
        </div>
        <div class="auth-terms">
          登录/注册即代表你同意 <a href="#">服务协议</a> 与 <a href="#">隐私政策</a>
        </div>
      </form>
    </div>
  </div>

  <!-- 主界面视图：登录后显示 -->
  <div id="app-view" class="view app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-name" data-brand>海拓商业版</span>
        <span class="brand-sub">平台</span>
      </div>
      <div class="user-chip">
        <span id="user-avatar" class="user-avatar">?</span>
        <span id="user-name" class="user-name"></span>
        <span id="role-badge" class="role-badge">用户</span>
      </div>
      <nav class="nav">
        <div class="nav-section">服务</div>
        <div id="nav-services"></div>
        <div class="nav-section" id="mgmt-section" hidden>管理</div>
        <div id="nav-management"></div>
      </nav>
      <div class="sidebar-footer">
        <button id="about-btn" class="about-btn" type="button">关于</button>
        <button id="logout" class="logout-btn" type="button">退出登录</button>
      </div>
    </aside>
    <main id="content" class="content"></main>
  </div>

  <div id="about-modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="about-brand">
      <div class="modal-head">
        <div>
          <div id="about-brand" class="brand-name" data-brand>海拓商业版</div>
          <div class="about-version">版本 <span id="about-version"></span></div>
        </div>
        <button id="about-close" class="modal-close" type="button" aria-label="关闭">×</button>
      </div>
      <p class="about-desc">多语言翻译 · 多渠道消息聚合 · 代理分销</p>
      <p class="about-note">账号与数据由 Supabase 安全存储 · 当前为商业版开发预览</p>
    </div>
  </div>

  <script src="services.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
